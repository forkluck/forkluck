log_format forkluck_connectors '$remote_addr $host "$request" $status '
                               '$body_bytes_sent $request_time';

server {
    server_name connectors.forkluck.com;
    client_max_body_size 2M;
    access_log /var/log/nginx/connectors.forkluck.access.log forkluck_connectors;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name connectors.forkluck.com;
    return 301 https://$host$request_uri;
}
