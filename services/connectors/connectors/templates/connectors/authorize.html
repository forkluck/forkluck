<!doctype html><html><head><meta charset="utf-8"><title>Connect {{ provider.displayName }}</title></head><body><main><h1>Connect {{ provider.displayName }}</h1><p>Sign in directly with {{ provider.displayName }}. Forkluck never receives these credentials.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Connect</button></form></main></body></html>
