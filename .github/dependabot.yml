# One grouped pull request per ecosystem per month. Framework majors (Django,
# Next.js, React) are upgraded deliberately, not by a bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: monthly
    groups:
      api:
        patterns: ["*"]
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /services/connectors
    schedule:
      interval: monthly
    groups:
      connectors:
        patterns: ["*"]
    ignore:
      # The service pins a range, and range updates are not classed by
      # semver, so name the versions outright.
      - dependency-name: django
        versions: [">=6"]
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
