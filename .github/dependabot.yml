version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /services/connectors
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
