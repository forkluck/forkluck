name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Contributor code runs on disposable hosted runners without deployment secrets.
# This workflow is the only verification gate: the main branch ruleset accepts
# nothing that did not pass here on an up-to-date branch. Jobs that a change
# cannot affect are skipped; a skipped required check still satisfies the
# ruleset.
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      connectors: ${{ steps.filter.outputs.connectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The checked-out commit merges the PR into main; its first parent is main.
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="everything"
          fi
          printf 'changed files:\n%s\n' "$changed"
          hit() { [ "$changed" = everything ] || printf '%s\n' "$changed" | grep -qE "$1"; }
          shared='^(\.github/workflows/|data/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          web=false; api=false; connectors=false
          hit "$shared|^apps/web/" && web=true
          hit "$shared|^apps/api/|^scripts/backend-test-shard\.py$" && api=true
          hit '^(\.github/workflows/|services/connectors/)' && connectors=true
          printf 'web=%s\napi=%s\nconnectors=%s\n' "$web" "$api" "$connectors" | tee -a "$GITHUB_OUTPUT"

  frontend-tests:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next's compiler cache; keyed on sources so a doc-only change reuses it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The Django suite runs as two shards dealt by module size. They are two
  # explicit jobs rather than a matrix: a skipped matrix job reports under its
  # unexpanded name, which would leave the required checks unsatisfied on a
  # pull request that does not touch the API.
  backend-1:
    name: Backend 1/2
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forkluck
          POSTGRES_PASSWORD: forkluck
          POSTGRES_DB: forkluck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://forkluck:forkluck@127.0.0.1:5432/forkluck_ci
      FORKLUCK_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install backend dependencies
        run: |
          python3 -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      # The CI database is thrown away after the run, so durability buys
      # nothing; without this every test transaction waits on disk.
      - name: Make the throwaway Postgres fast
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - run: pnpm db:migrate
      - run: pnpm verify:backend:checks
      - name: Validate catalog
        run: |
          apps/api/.venv/bin/python data/catalog/scripts/validate.py data/catalog/catalog.csv
          apps/api/.venv/bin/python -m unittest discover -s data/catalog/scripts -p "test_*.py"
      - run: apps/api/.venv/bin/python scripts/backend-test-shard.py 1 2

  backend-2:
    name: Backend 2/2
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forkluck
          POSTGRES_PASSWORD: forkluck
          POSTGRES_DB: forkluck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://forkluck:forkluck@127.0.0.1:5432/forkluck_ci
      FORKLUCK_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install backend dependencies
        run: |
          python3 -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      # The CI database is thrown away after the run, so durability buys
      # nothing; without this every test transaction waits on disk.
      - name: Make the throwaway Postgres fast
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - run: apps/api/.venv/bin/python scripts/backend-test-shard.py 2 2

  # The browser suite is one sequential story (each spec builds state the
  # next one reads), so it cannot be sharded across runners.
  acceptance:
    name: Browser acceptance
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        run: |
          python3 -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      # The Chromium download is the slow part of the browser install; the
      # cache is keyed on the lockfile, which pins the Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-acceptance/cache
          key: next-acceptance-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            next-acceptance-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @forkluck/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance

  connectors:
    name: Connectors
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/connectors
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectors
          POSTGRES_PASSWORD: connectors
          POSTGRES_DB: connectors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONNECTORS_DATABASE_URL: postgresql://connectors:connectors@127.0.0.1:5432/connectors
      CONNECTORS_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/connectors/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check config connectors manage.py
      - run: ruff check config connectors manage.py
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check

  skills:
    name: Agent skills
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r skills/requirements-dev.txt
      - run: python scripts/validate-skills.py
      - run: bash -n scripts/install-codex-links.sh
