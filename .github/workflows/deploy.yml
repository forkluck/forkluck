name: Deploy

on:
  push:
    branches:
      - main
    # The connector service and the agent skills ship through their own
    # workflows; a change confined to them does not roll an app release.
    paths-ignore:
      - services/connectors/**
      - skills/**
  workflow_dispatch:

concurrency:
  group: forkluck-production
  cancel-in-progress: false

permissions:
  contents: read

# Every commit on `main` arrived through a pull request whose CI workflow ran
# the full suite on GitHub-hosted runners against an up-to-date branch; the
# branch ruleset enforces that. This workflow therefore only packages and
# ships. Packaging runs on GitHub's Ubuntu runner because the release artifact
# must match the Linux server: `sharp` and `@napi-rs/canvas` ship
# platform-specific binaries. No machine outside GitHub takes part.
jobs:
  package:
    name: Package release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone frontend
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
          DJANGO_PUBLIC_ORIGIN: http://127.0.0.1:8001
        run: pnpm build
      - name: Stage and package release
        run: |
          # In the pnpm workspace the standalone tree nests the app at
          # apps/web/ beside hoisted node_modules; flattening it would break
          # pnpm's relative symlinks. The release keeps that shape and adds a
          # one-line entry at frontend/server.js, the path the systemd unit
          # and deploy-forkluck already expect.
          mkdir -p release/frontend/.next release/backend
          cp -R apps/web/.next/standalone/. release/frontend/
          cp -R apps/web/.next/static release/frontend/.next/static
          cp -R apps/web/.next/static release/frontend/apps/web/.next/static
          cp -R apps/web/public release/frontend/apps/web/public
          printf '%s\n' 'import("./apps/web/server.js")' > release/frontend/server.js
          cp -R apps/api/config apps/api/forkluck release/backend/
          cp apps/api/manage.py apps/api/requirements.txt release/backend/
          # The density manifest is read at runtime from the release root by
          # apps/api/forkluck/domains/shared/density.py (via forkluck/paths.py).
          cp -R data release/data
          tar -czf "forkluck-${GITHUB_SHA}.tar.gz" -C release frontend backend data
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-release
          path: forkluck-${{ github.sha }}.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy release
    needs: [package]
    if: needs.package.result == 'success' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-release
          path: .
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/forkluck_deploy
          chmod 600 ~/.ssh/forkluck_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          expected_foundation="$(
            sha256sum \
              deploy/deploy-forkluck \
              deploy/systemd/forkluck-pos-worker.service \
              deploy/systemd/forkluck-connector-worker.service \
              | awk '{print $1}'
          )"
          if ! remote_foundation="$(
            ssh -i ~/.ssh/forkluck_deploy -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sha256sum /usr/local/sbin/deploy-forkluck /etc/systemd/system/forkluck-pos-worker.service /etc/systemd/system/forkluck-connector-worker.service" \
              | awk '{print $1}'
          )"; then
            echo "Could not verify the production process foundation." >&2
            exit 1
          fi
          if [[ "$remote_foundation" != "$expected_foundation" ]]; then
            echo "Production process files differ from deploy/. Rerun provision-forkluck before this release." >&2
            exit 1
          fi
          scp -i ~/.ssh/forkluck_deploy -P "$DEPLOY_PORT" \
            "forkluck-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/releases/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/forkluck_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-forkluck '$GITHUB_SHA' '/home/$DEPLOY_USER/releases/$GITHUB_SHA.tar.gz'"
