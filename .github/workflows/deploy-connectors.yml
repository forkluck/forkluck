name: Deploy connectors

on:
  push:
    branches:
      - main
    paths:
      - services/connectors/**
      - .github/workflows/deploy-connectors.yml
  workflow_dispatch:

concurrency:
  group: forkluck-connectors-production
  cancel-in-progress: false

permissions:
  contents: read

# The connector service is its own process, database, and server user. It
# verifies and ships from services/connectors/ with the connectors-production
# environment's secrets, independent of the app release in deploy.yml.
jobs:
  verify-and-deploy:
    name: Verify and deploy connectors
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: connectors-production
    defaults:
      run:
        working-directory: services/connectors
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectors
          POSTGRES_PASSWORD: connectors
          POSTGRES_DB: connectors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONNECTORS_DATABASE_URL: postgresql://connectors:connectors@127.0.0.1:5432/connectors
      CONNECTORS_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/connectors/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check config connectors manage.py
      - run: ruff check config connectors manage.py
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Package release
        # deploy-connectors expects manage.py and config/wsgi.py at the archive
        # root, so the tarball is built from inside the service directory.
        run: |
          tar -czf "$GITHUB_WORKSPACE/forkluck-connectors-${GITHUB_SHA}.tar.gz" \
            config connectors manage.py requirements.txt
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/connectors_deploy
          chmod 600 ~/.ssh/connectors_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          expected="$(sha256sum deploy/deploy-connectors deploy/forkluck-connectors.service deploy/forkluck-connectors-cleanup.service deploy/forkluck-connectors-worker.service deploy/forkluck-connectors-cleanup.timer | awk '{print $1}')"
          remote="$(ssh -i ~/.ssh/connectors_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sha256sum /usr/local/sbin/deploy-forkluck-connectors /etc/systemd/system/forkluck-connectors.service /etc/systemd/system/forkluck-connectors-cleanup.service /etc/systemd/system/forkluck-connectors-worker.service /etc/systemd/system/forkluck-connectors-cleanup.timer" \
            | awk '{print $1}')"
          if [[ "$remote" != "$expected" ]]; then
            echo "Production connector foundation differs from deploy/." >&2
            exit 1
          fi
          scp -i ~/.ssh/connectors_deploy -P "$DEPLOY_PORT" \
            "$GITHUB_WORKSPACE/forkluck-connectors-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/releases/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/connectors_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-forkluck-connectors '$GITHUB_SHA' '/home/$DEPLOY_USER/releases/$GITHUB_SHA.tar.gz'"
