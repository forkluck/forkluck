# Forkluck public site (forkluck.com): static files under /var/www/forkluck-site,
# the mirror taken of the retired Ghost site. The application lives in
# forkluck.conf on app.forkluck.com; that file also owns the port-80 redirect
# for these two names. Both files must be installed together.

# Its own log_format: nginx rejects a duplicate name, so this file cannot share forkluck.conf's.
log_format forkluck_site '$remote_addr $host "$request" $status '
                         '$body_bytes_sent $request_time';

server {
    server_name forkluck.com;
    root /var/www/forkluck-site;
    access_log /var/log/nginx/site.forkluck.access.log forkluck_site;

    # The OG images the old marketing pages published still carry these URLs.
    location /screenshots/ {
        alias /var/www/forkluck-site/screenshots/;
        expires 30d;
    }

    # Every application route belongs to app.forkluck.com.
    location ~ ^/(login|signup|forgot-password|subscribe|recipes|ingredients|products|costs|labor|sales|menu|inventory|invoices|integrations|connections|settings|profile|source-and-legal|shared)(/|$) {
        return 302 https://app.forkluck.com$request_uri;
    }

    location ~ \.(css|js|woff2|png|jpg|svg|gif|webp)$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Keep www canonical.
server {
    server_name www.forkluck.com;
    return 301 https://forkluck.com$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
