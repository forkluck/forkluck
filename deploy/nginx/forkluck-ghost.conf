# Forkluck public site (forkluck.com) — self-hosted Ghost on 127.0.0.1:2368.
# The application lives in forkluck.conf on app.forkluck.com; that file also
# owns the port-80 redirect for these two names. Both files must be installed
# together.

# Its own log_format: nginx rejects a duplicate name, so this file cannot share forkluck.conf's.
log_format forkluck_ghost '$remote_addr $host "$request" $status '
                          '$body_bytes_sent $request_time';

server {
    server_name forkluck.com;
    # Ghost uploads images and theme zips through the admin.
    client_max_body_size 50M;
    access_log /var/log/nginx/ghost.forkluck.access.log forkluck_ghost;
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /var/www/forkluck;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # The OG images the old marketing pages published still carry these URLs.
    # Serve them from disk so the links in the wild keep resolving.
    location /screenshots/ {
        alias /opt/ghost/static/screenshots/;
        expires 30d;
    }

    location = /forkluck-logo.png {
        root /opt/ghost/static;
        expires 30d;
    }

    # Every application route now belongs to app.forkluck.com. 302, not 301:
    # what the apex serves is Ghost's to decide, and a permanent redirect would
    # pin these paths in caches beyond this cutover.
    location ~ ^/(login|signup|forgot-password|subscribe|recipes|ingredients|products|costs|labor|sales|menu|inventory|invoices|integrations|connections|settings|profile|source-and-legal|shared)(/|$) {
        return 302 https://app.forkluck.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Keep www canonical.
server {
    server_name www.forkluck.com;
    return 301 https://forkluck.com$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
