# Feedback shares the existing host and mail bridge. Its database and session
# secret are separate. Avoid logging OAuth codes or magic links in query strings.
log_format forkluck_feedback '$remote_addr $host "$request_method $uri" $status '
                            '$body_bytes_sent $request_time';

server {
    listen 80;
    server_name feedback.forkluck.com;
    location /.well-known/acme-challenge/ {
        root /var/www/forkluck;
    }
    location / {
        return 301 https://feedback.forkluck.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name feedback.forkluck.com;
    ssl_certificate /etc/letsencrypt/live/feedback.forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10M;
    access_log /var/log/nginx/feedback.forkluck.access.log forkluck_feedback;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
