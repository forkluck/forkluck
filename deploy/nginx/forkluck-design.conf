# Forkluck visual guide (design.forkluck.com) — the public component guide,
# rendered by the same Next process as the application on 127.0.0.1:3000.
# It has no service of its own, so this file must be installed alongside
# forkluck.conf: the $forkluck_static_root map and the forkluck log format
# are defined there, at http level, and are only used here.
#
# The certificate is the forkluck.com lineage, expanded to cover this name:
#   sudo certbot certonly --nginx --cert-name forkluck.com --expand \
#     -d forkluck.com -d www.forkluck.com -d app.forkluck.com \
#     -d chef.forkluck.com -d connectors.forkluck.com -d design.forkluck.com
#
# Only the guide's own paths are proxied. Everything else on this host is a
# 404, so the application is not reachable under a second name.
#
# No port-80 block here: forkluck.conf terminates plain HTTP for every
# Forkluck name (this one included) and redirects it to https, the same way
# it does for the Ghost hosts. A second block for the name would be reported
# by nginx as a conflicting server name and ignored.

server {
    server_name design.forkluck.com;
    access_log /var/log/nginx/design.forkluck.access.log forkluck;

    # Copied from forkluck.conf: open tabs request chunks from the deployment
    # that rendered them, and the guide is served by the same build.
    location ^~ /_next/static/ {
        alias $forkluck_static_root/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The host rewrite in next.config.ts turns "/" into /design, so the URL
    # the reader sees and the route Next renders are both correct here.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /design {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /icon.png {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Answered by app/robots.txt/route.ts, which allows this host only.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
