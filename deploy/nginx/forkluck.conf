# Forkluck application host (app.forkluck.com) — Next.js frontend with
# Django auth/admin. The public site at forkluck.com is Ghost and lives in
# forkluck-ghost.conf; both files must be installed together.

# $request_time and $status at the edge are the only record of requests the
# Django middleware never sees: 504s from a killed worker and 499 client
# aborts.
log_format forkluck '$remote_addr $host "$request" $status '
                    '$body_bytes_sent $request_time';

# Open tabs still request chunks from the deployment that rendered them.
# Only a full release hash may choose an older directory; everything else
# stays on current. Releases are retained by deploy-forkluck's existing policy.
map $arg_dpl $forkluck_static_root {
    default /opt/forkluck/current/frontend/.next/static;
    "~^[0-9a-f]{40}$" /opt/forkluck/releases/$arg_dpl/frontend/.next/static;
}

# The application host. The one certificate covers every Forkluck name,
# including the two forkluck-ghost.conf serves. Before first reload run:
#   sudo certbot certonly --nginx --expand -d forkluck.com -d www.forkluck.com \
#     -d app.forkluck.com
server {
    server_name app.forkluck.com;
    # An accepted 8 MB photo becomes 10.67 MB of base64, plus JSON metadata.
    client_max_body_size 12M;
    access_log /var/log/nginx/app.forkluck.access.log forkluck;
    error_page 502 503 504 =503 /maintenance.html;

    location ^~ /_next/static/ {
        alias $forkluck_static_root/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /maintenance.html {
        internal;
        root /var/www/forkluck;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /mommy {
        return 301 /mommy/;
    }

    location /mommy/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-static/ {
        alias /opt/forkluck/current/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/billing/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Square/Shopify OAuth connect + callback endpoints (Django).
    location /api/integrations/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forkluck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkluck.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Port 80 for every Forkluck name — nginx terminates plain HTTP for the
# Ghost hosts here too, and sends all of it to https.
server {
    listen 80;
    server_name forkluck.com www.forkluck.com app.forkluck.com;
    return 301 https://$host$request_uri;
}
